[project]
name = "studioforge"
# The human/display version is `1.26-08-30` (see `src/studioforge/__init__.py`
# `__version__`, which is what /health, the GUI, MCP and the User-Agent report).
# PEP 440 cannot spell a hyphenated date, so the package metadata carries the
# same date as `1.26.8.30`. Release tags are `v1.26-08-30`.
version = "1.26.8.30"
description = "Self-hosted GPU-only LLM serving system: OpenAI-compatible gateway over llama.cpp llama-server, with model manager, VRAM planner, GUI and MCP control plane."
readme = "README.md"
requires-python = ">=3.12"
# SPDX expression + license-files (PEP 639). Deliberately NOT a
# `License :: OSI Approved :: ...` trove classifier as well: hatchling refuses
# a build that carries both, and the expression is the machine-readable one.
license = "MIT"
license-files = ["LICENSE"]
keywords = ["llama.cpp", "llm", "openai-compatible", "gpu", "mcp", "lm-studio"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "structlog>=24.4",
    "nicegui>=2.7",
    "huggingface-hub>=0.26",
    "nvidia-ml-py>=12.560",
    "mcp>=1.2",
    "pillow>=11.0",
    "psutil>=6.1",
    "pystray>=0.19",
    "typer>=0.15",
    "rich>=13.9",
    # Windows-only: job objects (children die with the supervisor, D23) and PDH
    # per-process VRAM attribution. Both degrade gracefully when absent, but a
    # fresh install must get them without being told (WP17 F10).
    "pywin32>=306; sys_platform == 'win32'",
]

[project.urls]
Homepage = "https://github.com/LaserLloyd/StudioForge"
Repository = "https://github.com/LaserLloyd/StudioForge"
Issues = "https://github.com/LaserLloyd/StudioForge/issues"
Changelog = "https://github.com/LaserLloyd/StudioForge/blob/main/DECISIONS.md"

[project.optional-dependencies]
dev = [
    # The test stack has an upper bound because pytest-asyncio 0.x -> 1.x
    # changed fixture loop scoping and pytest majors move collection rules;
    # the two gate tools are pinned EXACTLY: `ruff format` output differs
    # between ruff releases, so a floating pin means `just lint` is green on
    # one machine and red on the next for the same tree.
    "pytest>=8.3,<10",
    "pytest-asyncio>=1.0,<2",
    "pytest-timeout>=2.3,<3",
    "openai>=1.57",
    "ruff==0.16.3",
    "mypy==2.3.1",
    "types-pyyaml",
    "types-psutil",
    # tests/unit/test_companion.py and test_docs.py import
    # packages/studioforge-companion off sys.path rather than installing it, so
    # its one dependency the server does not already have must be here or the
    # suite fails at COLLECTION on a fresh checkout. Everything else the
    # companion needs (typer, rich, httpx, mcp, pydantic) is a runtime dep above.
    "tomli-w>=1.0",
]

[project.scripts]
studioforge = "studioforge.__main__:main"
studioforge-watchdog = "studioforge.watchdog.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/studioforge"]
include = ["src/studioforge/migrations/*.sql", "src/studioforge/data/*.json"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RET", "PTH", "ASYNC", "TID"]
ignore = ["B008", "SIM108"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["studioforge"]
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true

[[tool.mypy.overrides]]
# win32job/win32api/win32pdh: pywin32 ships no stubs (types-pywin32 is a separate
# package and stale). They are imported inside try-guarded helpers that already
# degrade on ImportError, so a missing stub buys nothing.
module = [
    "pynvml.*",
    "nicegui.*",
    "huggingface_hub.*",
    "mcp.*",
    "yaml.*",
    "PIL.*",
    "win32api.*",
    "win32job.*",
    "win32pdh.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["studioforge.gui.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# The contract suite loads REAL models onto the REAL GPUs. `testpaths` means a
# bare `pytest` collects it, and on 2026-08-18 an agent running `pytest tests`
# did exactly that: three llama-server children held ~25 GiB after the run
# "finished". Opting out by default makes the dangerous case the explicit one.
# `just test-contract` (or -m contract with SF_RUN_CONTRACT=1) opts back in.
addopts = "-m 'not contract'"
markers = [
    "contract: real engine + real GGUF weights on the real GPUs; opt-in (needs SF_RUN_CONTRACT=1)",
]
filterwarnings = ["ignore::DeprecationWarning"]
timeout = 300
