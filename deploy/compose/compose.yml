# StudioForge in a container -- base file. Add exactly ONE GPU override:
#
#   NVIDIA, Docker    docker compose -f compose.yml -f compose.cuda.yml up -d
#   NVIDIA, Podman    podman compose -f compose.yml -f compose.cuda.podman.yml up -d
#   AMD ROCm          docker compose -f compose.yml -f compose.rocm.yml  up -d   (SF_BACKEND=rocm)
#   Vulkan (AMD/Intel) docker compose -f compose.yml -f compose.vulkan.yml up -d (SF_BACKEND=vulkan)
#
# Then open http://localhost:8080 (control panel) -- the OpenAI-compatible base
# URL for clients is http://localhost:1234/v1 .  docs/deploy/docker.md has the
# full walkthrough, the offline-engine alternative and the troubleshooting list.
#
# StudioForge is GPU-only: without a GPU override the container still boots and
# /health answers, but reports can_serve=false.
name: studioforge

services:
  studioforge:
    image: ghcr.io/laserlloyd/studioforge:${SF_VERSION:-1.26-09-23}-${SF_BACKEND:-cuda}
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        BACKEND: ${SF_BACKEND:-cuda}
        VERSION: ${SF_VERSION:-1.26-09-23}
    container_name: studioforge
    hostname: studioforge
    # `init: true` is required: `serve` spawns a watchdog sidecar and one
    # llama-server child per loaded model, and PID 1 must reap them.
    init: true
    # unless-stopped, not on-failure: a graceful stop exits 130, which
    # on-failure would treat as a crash.
    restart: unless-stopped
    # Drain (server.drain_timeout_s = 30) plus stopping every child.
    stop_grace_period: 60s
    ports:
      # Local-only by default. SF_BIND=0.0.0.0 publishes to the LAN -- do that
      # only with server.api_key set (Setup tab) or behind a TLS proxy.
      - "${SF_BIND:-127.0.0.1}:${SF_GATEWAY_PORT:-1234}:1234"   # gateway: /v1 /api /mcp /health
      - "${SF_BIND:-127.0.0.1}:${SF_PANEL_PORT:-8080}:8080"     # control panel
      - "${SF_BIND:-127.0.0.1}:${SF_WATCHDOG_PORT:-1235}:1235"  # watchdog: MCP + /health
    environment:
      TZ: ${TZ:-UTC}
      SF_DATA_DIR: /data
      # First-run default only: config.yaml wins once the Setup tab has saved.
      SF_MODELS__DIR: /models
    volumes:
      # config.yaml, registry, engines/ (llama.cpp builds), logs/, downloads/.
      - ${SF_DATA:-studioforge-data}:/data
      # Your GGUF library, read-only. Downloads from the panel go to the data
      # volume's downloads/ -- point models.dir at a writable path if you want
      # them in the library.
      - ${SF_MODELS:-./models}:/models:ro,z
    user: "${SF_UID:-1000}:${SF_GID:-1000}"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs:
      - /tmp
      - /home/studioforge:mode=1777   # scrub-ok: the container user's home inside the image, not a person's
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

volumes:
  studioforge-data:
    name: studioforge-data
