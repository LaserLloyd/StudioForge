name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    # Windows first: it is the reference platform (the tray, the Job Object
    # VRAM guard, the PDH counters). The unit suite never touches a GPU -- the
    # probe falls back to a null backend when NVML is absent -- and the
    # contract suite (real engines, real weights) is deselected by default.
    name: lint + unit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      - name: Install the package with dev extras
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv -e ".[dev]"

      - name: Lint (ruff check)
        run: uv run --python .venv ruff check src/ tests/ packages/

      - name: Format (ruff format --check)
        run: uv run --python .venv ruff format --check src/ tests/ packages/

      - name: Unit tests
        env:
          SF_GPU_PROBE: "null"
        run: uv run --python .venv pytest tests/unit -q --timeout=300
