name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  privacy:
    # Keeps CONTRIBUTING's "no personal data in the repository" rule from being
    # an honour system. Runs FIRST and on its own runner: it is seconds long,
    # needs no toolchain, and a leak should fail the build before anything else
    # spends time.
    #
    # Read the note this prints. scripts/scrub-rules.local.txt is git-ignored on
    # purpose -- publishing the list of words that must never be published is
    # its own leak -- so in CI the personal-identifier rules are NOT loaded and
    # this job verifies the generic patterns only (keys, tokens, private keys,
    # home paths, Windows user profiles, emails). The maintainer's clone is
    # where the name and hostname rules actually run, via the git hooks.
    name: no private data
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 because the commit-range step below needs the PR's base
      # commit, and the default shallow clone does not contain it -- the scan
      # then fails with "unknown revision" on every pull request.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Scan the tree
        run: python3 scripts/scrub_check.py
      - name: Scan the TREE of every commit in the pull request
        if: github.event_name == 'pull_request'
        # Not just the head: a secret added in one commit and removed in the
        # next still publishes, and a head-only scan calls that clean.
        # One finding is tolerated in OLD commits only: the argon2id hash-format prefix
        # that two unit-test files spelled out before they carried a scrub-ok marker.
        # It names a hash format, not a secret, and history is not rewritten. The tip
        # is scanned strictly by the step above; any other finding in any commit (or
        # a crash that reports no findings) still fails here.
        run: |
          allowed="(tests/unit/[a-z_]+[.]py|[.]github/workflows/ci[.]yml):[0-9]+: looks like a password hash .* '[$]argon2id[$]'"
          status=0
          for sha in $(git rev-list --reverse \
              "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"); do
            if out=$(python3 scripts/scrub_check.py --rev "$sha" 2>&1); then
              continue
            fi
            problems=$(printf '%s\n' "$out" | sed -n 's/.*scrub_check: \([0-9][0-9]*\) problem.*/\1/p')
            known=$(printf '%s\n' "$out" | grep -cE "^  $allowed" || true)
            if [ -n "$problems" ] && [ "$problems" = "$known" ]; then
              echo "commit $sha: only the known argon2id-prefix finding (tolerated in history)"
            else
              printf '%s\n' "$out"
              status=1
            fi
          done
          exit $status
      - name: Scan the commit messages being pushed
        if: github.event_name == 'pull_request'
        run: |
          python3 scripts/scrub_check.py --commit-range \
            "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
      - name: Prove the scanner still works
        run: python3 scripts/scrub_check.py --selftest

  unit:
    # Windows first: it is the reference platform (the tray, the Job Object
    # VRAM guard, the PDH counters). The unit suite never touches a GPU -- the
    # probe falls back to a null backend when NVML is absent -- and the
    # contract suite (real engines, real weights) is deselected by default.
    name: lint + unit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        # Pinned to an exact tag: setup-uv stopped publishing moving major
        # tags (there is no `v10` ref, only `v10.0.x`), so `@v10` makes both
        # matrix legs die at "Set up job" -- before checkout, with no log a
        # step could leave behind.
        uses: astral-sh/setup-uv@v10.0.1

      - name: Set up Python
        run: uv python install 3.12

      - name: Install the package with dev extras
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv -e ".[dev]"

      - name: Vendored ForgeUI bundle matches forgeui.json
        # gui/theme/ is the ForgeUI (ThemeForge) bundle, vendored whole. This fails on a
        # different version, a stale or hand-edited bundle file, a missing or changed
        # overlay, or settings naming a theme the bundle lacks. Fix: `python -m forgeui
        # vendor` (docs/DEVELOPMENT.md, "GUI theming"). forgeui comes from the release tag,
        # not PyPI (that name belongs to another project).
        run: |
          # ForgeUI 1.2.0 pinned to the ThemeForge commit; switch to @v1.2.0 once that tag exists (OWNER_ACTIONS #22)
          uv pip install --python .venv "forgeui @ git+https://github.com/LaserLloyd/ThemeForge@d70f6608bdf386fc095d43fc1caec61e88664795"
          uv run --python .venv --no-sync python -m forgeui vendor --check

      - name: Lint (ruff check)
        run: uv run --python .venv ruff check src/ tests/ packages/

      - name: Format (ruff format --check)
        run: uv run --python .venv ruff format --check src/ tests/ packages/

      - name: Generated contracts and reference docs are current
        # docs/contracts/*.json (OpenAPI, MCP tools, errors, settings, capabilities) and
        # docs/reference/*.md are generated from code. A route, tool, error code or
        # setting changed without regenerating fails here with the command that fixes it.
        env:
          SF_GPU_PROBE: "null"
        run: uv run --python .venv python scripts/gen_docs.py --check

      - name: Unit tests
        env:
          SF_GPU_PROBE: "null"
          # tests/unit/test_forgeui_vendor.py runs `forgeui vendor --check` too; with this set a
          # missing forgeui package fails the test instead of skipping it.
          FORGEUI_REQUIRED: "1"
          # pystray's Linux backends want an X display at import time (the
          # xorg one opens it at module level, and the error it raises is not
          # an ImportError, so importorskip cannot skip it). The tray tests
          # never run an icon, so the headless runner gets the inert backend.
          # Windows keeps the real _win32 backend: it is the reference
          # platform and the only leg where a pywin32 regression would show.
          # pystray treats an empty value as "platform default".
          PYSTRAY_BACKEND: ${{ runner.os == 'Linux' && 'dummy' || '' }}
        run: uv run --python .venv pytest tests/unit -q --timeout=300
