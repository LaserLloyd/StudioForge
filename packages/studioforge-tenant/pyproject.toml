[project]
name = "studioforge-tenant"
# Ships from the same release as the server and carries the same version
# (SemVer since 2.0.0; `1.26-09-23` / `1.26.9.23` before that).
version = "2.0.1"
description = "Tenant SDK for StudioForge's VRAM Tenant Protocol (vt.1): lease a GPU, register, honour a vacate request."
readme = "README.md"
# 3.12, like the server: a tenant runs on the GPU box beside StudioForge, and
# the box already has 3.12 for the server itself.
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["studioforge", "gpu", "vram", "lease", "gpu-lease", "tenant", "multi-gpu"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

# httpx and nothing else. The SDK is a thin client over documented HTTP routes
# (docs/TENANTS.md); it must install into any tenant's virtualenv without
# dragging the server's dependency tree with it, and it never imports
# `studioforge`.
dependencies = [
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://www.laserlloyd.com/projects/studioforge-gpu-only-llm-server/"
Repository = "https://github.com/LaserLloyd/StudioForge"
Issues = "https://github.com/LaserLloyd/StudioForge/issues"
Changelog = "https://github.com/LaserLloyd/StudioForge/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10",
    "pytest-asyncio>=1.0,<2",
    "ruff==0.16.3",
    "mypy==2.3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/studioforge_tenant"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RET", "PTH", "ASYNC", "TID"]
ignore = ["B008", "SIM108"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["studioforge_tenant"]
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
strict_equality = true
