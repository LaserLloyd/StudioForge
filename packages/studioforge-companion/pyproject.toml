[project]
name = "studioforge-companion"
version = "0.2.0"
description = "sfctl: thin remote control + MCP bridge for a StudioForge server (LLM serving over llama.cpp)."
readme = "README.md"
# 3.11, not 3.12: this package gets installed on whatever box runs the agent
# (an OpenClaw host, a laptop, a NAS), which frequently lags the server rig.
# tomllib is stdlib from 3.11, so reading config needs no extra dependency.
requires-python = ">=3.11"
# No licence chosen yet: all rights reserved. Do not add a licence
# classifier or a LICENSE file until one is picked deliberately.
keywords = ["llm", "llama.cpp", "mcp", "cli", "studioforge"]

# Deliberately does NOT depend on `studioforge`. The companion is a pure
# client: every piece of state (registry, planner, engine, config) lives on the
# server and is reached over HTTP, so this stays installable anywhere.
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
    "mcp>=1.2",
    "pydantic>=2.7",
    "tomli-w>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10",
    "pytest-asyncio>=1.0,<2",
    "ruff==0.16.3",
    "mypy==2.3.1",
]

[project.scripts]
sfctl = "studioforge_companion.cli:main"

# [project.urls] is deliberately absent: the project has no public home yet,
# and a placeholder URL is baked into every published wheel's metadata. Add
# `Homepage = "https://github.com/<owner>/<repo>"` when there is one.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/studioforge_companion"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RET", "PTH", "ASYNC", "TID"]
ignore = ["B008", "SIM108"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["studioforge_companion"]
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["mcp.*", "httpx2.*", "tomli_w.*"]
ignore_missing_imports = true
