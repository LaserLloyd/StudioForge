# StudioForge configuration -- the generated defaults, annotated.
#
# YOU DO NOT NEED THIS FILE. StudioForge writes its own `config.yaml` into the
# data directory on first run, filling in what it detects about this machine.
# This copy is a reference: every key the app understands, with the shipped
# default, so you can see what exists before changing anything.
#
# WHERE THE REAL ONE LIVES: `<data dir>/config.yaml`, and the data dir is
# `SF_DATA_DIR` if set, else `<repo>/data` in a checkout, else the platform
# data directory. `studioforge config` prints the effective values (secrets
# redacted). `data_dir` is deliberately absent below because it is derived --
# setting it here would fight the environment.
#
# The keys that actually matter on a new install:
#
#   models.dir              your GGUF library. Left null, first run probes for
#                           an LM Studio one (including the relocated
#                           `downloadsFolder` in ~/.lmstudio/settings.json).
#                           models.extra_dirs adds more, scanned after it.
#   server.port             1234, the port LM Studio uses, so pointing an
#                           existing OpenAI client here is a host change.
#   server.api_key          null = open on your LAN/tailnet. Set it and it is
#                           required on /v1, /api, /mcp and the watchdog.
#                           Minimum 6 characters so log redaction can catch it.
#   mcp.pin                 pairing code for the /mcp endpoint ONLY, separate
#                           from the API key. Auto-generated on first run and
#                           printed in the startup banner. Blank here on
#                           purpose -- never commit a real one.
#   models.default_ctx      the context FLOOR. The planner never recommends
#                           less than this to buy an extra parallel slot.
#   models.target_ctx       what every load AIMS for, halving down to what
#                           actually fits in VRAM, never below default_ctx.
#   models.default_parallel "auto" sizes conversation slots per model and
#                           placement; an explicit integer is honoured verbatim.
#   models.ttl_by_priority  idle TTL per load tier since the last request:
#                           {1: 900, 2: 900, 3: 600} -- the chat model and an
#                           agent's model idle out after 15 minutes,
#                           background (and any load that named no tier)
#                           after 10. Empty = default_ttl_s for every tier.
#   engine.pinned_tag       the llama.cpp build in use. `studioforge engine
#                           --update` moves this on only after a smoke test.
#   engine.cuda_variant     "auto" picks the CUDA build matching your driver;
#                           pin it ("13.3", "12.4") if the guess is wrong.
#   engine.update_channel   "stable" (default) recommends the build named by
#                           upstream's newest vX.Y.Z release (its
#                           nightly-tag.txt, e.g. v0.4.0 -> b10809);
#                           "latest" the newest bNNNN build this box can
#                           install. Both are always shown.
#   planner.excluded_devices  CUDA indices the planner may never touch, for a
#                           box that also runs ComfyUI or a training job.
#   planner.reserved_mb     {index: MiB} held back on a card -- the softer
#                           version of the same knob, applied even to a forced
#                           placement, because it is the NEIGHBOUR's memory.
#   planner.headroom_fraction  fraction of every card left free (0.10 = 10%).
#   planner.preference      "quality" (default) or "throughput": whether the
#                           catalog's recommended load keeps the best KV cache
#                           or takes the biggest window / a second slot.
#   hf.token                HuggingFace token for gated repos. A secret: it is
#                           registered for log redaction, and it does not
#                           belong in version control.
#
# Everything else has a sensible default and a reason in DECISIONS.md.

server:
  host: 0.0.0.0
  port: 1234
  api_key: null
  cors_origins:
  - '*'
  cors_allow_credentials: false
  drain_timeout_s: 30.0
  request_timeout_s: 900.0
gui:
  enabled: true
  host: 0.0.0.0
  port: 8080
  refresh_interval_s: 2.0
watchdog:
  enabled: true
  host: 0.0.0.0
  port: 1235
  poll_interval_s: 10.0
  health_timeout_s: 5.0
  wedged_after_failures: 3
mcp:
  enabled: true
  path: /mcp
  pin: null
  pin_required: true
  advertise: true
models:
  dir: null
  extra_dirs: []
  default_ctx: 8192
  default_ttl_s: 600
  ttl_by_priority:
    '1': 900
    '2': 900
    '3': 600
  default_kv_cache_type: auto
  default_parallel: auto
  ctx_per_slot_default: 32768
  default_flash_attn: 'on'
  default_cache_reuse: 256
  default_reasoning_format: none
  thinking_default_ctx: 32768
  target_ctx: 1048576
  auto_load_pinned: true
  default_model: null
  preload_default_model: false
engine:
  pinned_tag: b10425
  cuda_variant: auto
  keep_versions: 3
  allow_source_build: true
  repo: ggml-org/llama.cpp
  # Which release "Check for update" and `engine --update` act on (D62).
  # "stable": the bNNNN build named by upstream's newest vX.Y.Z version
  # release (its nightly-tag.txt asset); "latest": the newest bNNNN build
  # with an asset this box can install. The other channel is still reported.
  update_channel: stable
  smoke_test_timeout_s: 180.0
  # Host-RAM prompt cache (`--cache-ram`): evicted prompt prefixes are kept in
  # system memory instead of recomputed. Costs no VRAM, changes no output, so
  # it is on by default. "auto" = a POOL of 25% of RAM capped at 32 GiB, shared
  # out among the loaded models; an explicit integer is per model, verbatim.
  # 0 disables it, -1 is the engine's "no limit".
  cache_ram_mb: auto
  # `--ubatch-size` for every model that does not set its own. Raising it
  # buys prompt speed with compute-buffer VRAM the planner then charges per
  # card (D40) -- a trade to make knowingly, so it ships unset (engine's 512).
  ubatch_size: null
  # `--ubatch-size` for a MANY-SLOT launch (>4 slots) when nothing above is
  # set. D38 measured a larger micro-batch as pure prefill speed and D40 made
  # the estimate charge its VRAM, so the automatic raise is safe (error
  # direction: a refused context, never an OOM). Helps exactly the heavy
  # concurrent prefill; a single-stream load stays at the engine's 512. null
  # turns the automatic raise off.
  ubatch_many_slots: 1024
  # `--backend-sampling`: GPU-side sampling. b10425 marks it EXPERIMENTAL, so
  # it is off under the quality-first rule (only lossless, non-experimental
  # features ship enabled).
  backend_sampling: false
planner:
  headroom_fraction: 0.1
  on_insufficient: evict
  compute_overhead_fraction: 0.06
  compute_overhead_floor_mb: 400
  cuda_context_mb: 300
  image_tokens_default: 1024
  mmproj_compute_mb: 512
  prefer_single_gpu: true
  mixed_generation_split: fallback
  # Trust what a configuration measured last time over what the formula
  # computes for it (D51): a clean per-device observation of the same model at
  # the same context, slots, KV cache types and device COUNT is taken as the
  # estimate plus 10%, clamped to 0.60-1.30 of the formula's own answer.
  observed_correction: true
  rebalance: auto
  # What the catalog's one recommended load per model optimises for (D36):
  # "quality" = the best KV cache that reaches the context floor, then the
  # largest window at that quality; "throughput" = the largest window, and a
  # second slot if it fits, even with a quantized cache.
  preference: quality
  quant_affinity:
    NVFP4:
      min_compute_capability: '12.0'
      mode: prefer
    MXFP4:
      min_compute_capability: '12.0'
      mode: prefer
  excluded_devices: []
  reserved_mb: {}
gateway:
  child_port_start: 18100
  child_port_end: 18200
  load_timeout_s: 600.0
  health_poll_interval_s: 0.5
  max_restarts: 3
  restart_backoff_s: 2.0
  max_images_per_request: 8
  max_image_bytes: 20971520
  allow_private_image_hosts: false
  image_fetch_timeout_s: 20.0
  max_image_dim: 2048
  ttl_sweep_interval_s: 15.0
  stream_keepalive_interval_s: 5.0
  merge_reasoning_into_content: true
  deep_probe_timeout_s: 20.0
  deep_probe_max_tokens: 8
leases:
  # Vacating (D56): when a better-class lease asks for cards a holder that
  # registered a `vacate_url` is holding, the holder has this long to release
  # before the asker gets today's plain `409 lease_conflict` again.
  vacate_timeout_s: 180.0
  vacate_retry_after_s: 15.0
  vacate_callback_timeout_s: 30.0
benchmark:
  # The D46 class this server's own benchmark leases carry: 2 may ask a
  # background render tenant to vacate; 3 asks nobody (pre-D56 behaviour).
  lease_priority: 2
hf:
  token: null
  cache_dir: null
  max_concurrent_downloads: 2
  chunk_bytes: 8388608
logging:
  level: INFO
  json: false
  # Log files rotate at this size (MiB) and keep this many copies (D69).
  # 0 never rotates.
  file_max_mb: 20
  file_backups: 5
update:
  # GitHub `owner/name` that publishes StudioForge releases, or null when there
  # is none yet: the self-update check then reports "not configured" without
  # asking GitHub. (The old placeholder `studioforge/studioforge` is treated
  # the same as null.)
  repo: null
  channel: stable
  auto_check: true
  check_interval_h: 24.0
  health_check_timeout_s: 60.0
